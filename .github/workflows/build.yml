name: Build e Release Automatizado

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilar Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Baixar Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar com PyInstaller
        run: |
          pyinstaller --noconfirm --clean transcritor.spec

      - name: Compactar Executável Windows (Zip)
        run: |
          Compress-Archive -Path dist/TranscritorLocal -DestinationPath dist/TranscritorLocal-Windows-x64.zip

      - name: Salvar Artefato
        uses: actions/upload-artifact@v4
        with:
          name: TranscritorLocal-Windows-x64
          path: dist/TranscritorLocal-Windows-x64.zip

  build-linux:
    name: Compilar Linux (AppImage & Tar)
    runs-on: ubuntu-22.04
    steps:
      - name: Baixar Código
        uses: actions/checkout@v4

      - name: Instalar Dependências do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libtk8.6 libtcl8.6 ffmpeg

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar com PyInstaller
        run: |
          pyinstaller --noconfirm --clean transcritor.spec

      - name: Compactar Binário Linux
        run: |
          cd dist
          tar -czf TranscritorLocal-Linux-x86_64.tar.gz TranscritorLocal

      - name: Salvar Artefato
        uses: actions/upload-artifact@v4
        with:
          name: TranscritorLocal-Linux-x86_64
          path: dist/TranscritorLocal-Linux-x86_64.tar.gz

  release:
    name: Publicar no GitHub Releases
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Artefatos do Windows
        uses: actions/download-artifact@v4
        with:
          name: TranscritorLocal-Windows-x64
          path: release-assets/

      - name: Baixar Artefatos do Linux
        uses: actions/download-artifact@v4
        with:
          name: TranscritorLocal-Linux-x86_64
          path: release-assets/

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
